<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋招速投</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header><span class="logo">秋</span><div><h1>秋招速投</h1><p>资料只填一次，网申复用</p></div></header>
  <section class="connection"><button id="open-site" class="link">打开网站 / 登录</button><button id="sync">同步资料</button><label>用于本次填写的岗位<select id="job"><option value="">仅使用个人档案</option></select></label><p id="sync-info">尚未同步。先在网站维护真实资料。</p><button id="profile" class="link">编辑个人档案</button></section>
  <nav><button id="capture-tab" class="active">采集岗位</button><button id="fill-tab">填写网申</button></nav>
  <div id="status" role="status" aria-live="polite">切换到招聘网页，点击采集。</div>
  <main>
    <section id="capture-pane">
      <p class="hint">采集当前可见截图和网页正文；选中文字可限定正文。点击后可预览，确认再发送给网站 AI 提取。</p>
      <button id="capture" class="primary">截图并采集当前页面</button>
      <div id="capture-preview" hidden><img id="screenshot" alt="本次页面截图"><button id="extract">用网站 AI 提取岗位信息</button></div>
      <form id="job-form" hidden>
        <label>公司<input id="company" required maxlength="120"></label><label>岗位<input id="role" required maxlength="160"></label>
        <label>地点<input id="location" maxlength="120"></label><label>截止日期<input id="deadline" type="date"></label>
        <label>来源链接<input id="source-url" type="url"></label><label>岗位描述<textarea id="jd" rows="12" required minlength="30" maxlength="40000"></textarea></label>
        <button id="save-job" class="primary" type="submit">确认并保存到网站</button>
      </form>
    </section>
    <section id="fill-pane" hidden>
      <p class="hint">只填有资料且对应明确的字段，默认保留已有内容。没有资料的留空；不会点击提交、协议或验证码。</p>
      <button id="scan" class="primary">识别当前页面字段</button>
      <p class="hint">如需处理嵌入式表单，可授权该表单的域名，然后重新识别。新增教育/经历行或进入下一页后，也请重新识别。</p>
      <div class="row"><input id="frame-origin" placeholder="https://嵌入表单域名" aria-label="嵌入表单域名"><button id="grant-frame">授权域名</button></div>
      <label class="check"><input type="checkbox" id="overwrite">覆盖所选字段的已有内容</label>
      <div id="fields"></div>
      <button id="fill" class="primary" disabled>填写所选字段（不提交）</button>
      <button id="forget" class="link">清除此网站记住的对应关系</button>
      <div id="results" role="status"></div>
    </section>
  </main><footer>不推测资料 · 不自动提交 · 对应关系仅保存在本机</footer>
  <script type="module" src="sidepanel.js"></script>
</body></html>
